version: "3.8"

services:
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_PROFILE=prod
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-change-me-in-production}
    volumes:
      - ./api-server/config:/app/config
    restart: unless-stopped

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-server
    restart: unless-stopped

  admin-app:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api-server
    restart: unless-stopped
